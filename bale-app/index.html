<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هواشناس (بله)</title>
  
  <script src="https://tapi.bale.ai/miniapp.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Tahoma, Arial, sans-serif; background: #eef2f6; color: #666; }
    .app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 14px; }
    .search-box { width: 100%; max-width: 380px; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 5px 25px #00000012; text-align: center; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { margin: 0; font-size: 21px; color: #35465b; }
    .icon-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 0; }
    #cityInput { width: 100%; padding: 13px; border: 1px solid #d5dce3; border-radius: 6px; font: inherit; outline: none; }
    #cityInput:focus { border-color: #3783ce; }
    #getWeatherBtn { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 6px; background: #1769aa; color: white; font: inherit; cursor: pointer; }
    .message { font-size: 13px; line-height: 1.8; }
    .suggestions { margin-top: 8px; max-height: 220px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; background: white; text-align: right; }
    .suggestions > * { padding: 10px; cursor: pointer; }
    .suggestions > *:hover { background: #edf5fc; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="appScreen" class="app">
    <div class="search-box">
      <div class="header">
        <h1 id="appTitle">اپلیکیشن آب و هوا</h1>
        <button id="settingsBtn" class="icon-btn">⚙️</button>
      </div>
      <input id="cityInput" type="text" placeholder="نام شهر را وارد کنید" autocomplete="off" />
      <button id="getWeatherBtn">دریافت آب و هوا</button>
      <div id="suggestions" class="suggestions hidden"></div>
      <p id="message" class="message"></p>
    </div>
  </div>

  <!-- این بخش موقتا حذف شد تا فقط ظاهر اصلی را ببینیم -->
  <script>
    // یک اسکریپت کوچک برای جلوگیری از خطا
    document.getElementById("getWeatherBtn").addEventListener("click", () => {
      alert("دکمه کار می‌کند! مرحله بعدی اتصال به API است.");
    });
  </script>
</body>
</html>
